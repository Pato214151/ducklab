<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background: #0a0a0b;
    color: #fff;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 96px;
  }
  /* halo rojo */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 55% 70% at 18% 30%, rgba(219,31,46,0.30), transparent 60%);
  }
  /* rejilla tenue */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 72px 72px;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 20% 30%, #000 30%, transparent 75%);
  }
  /* línea láser inferior */
  .laser {
    position: absolute; left: 96px; right: 96px; bottom: 92px; height: 3px;
    background: linear-gradient(to right, #db1f2e, rgba(219,31,46,0.05));
    box-shadow: 0 0 24px rgba(219,31,46,0.5);
  }
  .row { display: flex; align-items: center; gap: 28px; position: relative; }
  .badge {
    width: 104px; height: 104px; border-radius: 26px;
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 50px -12px rgba(219,31,46,0.6);
  }
  .brand { font-size: 64px; font-weight: 800; letter-spacing: -0.02em; }
  .brand .lab { color: #db1f2e; }
  h1 {
    position: relative;
    margin-top: 52px;
    font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -0.03em;
    max-width: 900px;
  }
  h1 .accent { color: #db1f2e; }
  .sub {
    position: relative;
    margin-top: 28px;
    font-family: 'Consolas', ui-monospace, monospace;
    font-size: 24px; letter-spacing: 0.28em; text-transform: uppercase;
    color: #a1a1aa;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="row">
    <div class="badge">
      <svg viewBox="0 0 24 24" width="62" height="62" fill="#fff">
        <ellipse cx="12.6" cy="15.4" rx="7.6" ry="4.2"/>
        <circle cx="8.4" cy="9.4" r="4.5"/>
        <path d="M12 7.7 L18.6 8.4 c0.9 0.1 0.9 1.3 0 1.4 L12 10.7 Z"/>
        <circle cx="9.7" cy="8.6" r="1.05" fill="#8a1212"/>
      </svg>
    </div>
    <div class="brand">Duck<span class="lab">lab</span></div>
  </div>

  <h1>Transformo ideas en<br><span class="accent">soluciones digitales</span>.</h1>
  <div class="sub">POS · Web · Escritorio · IA — Colombia</div>

  <div class="laser"></div>
</body>
</html>
